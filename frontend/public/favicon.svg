<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: from-emerald-600 to-teal-500 matching App Navbar Logo -->
    <linearGradient id="foodflow-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Glossy top highlight for Apple/Modern SaaS app icon depth -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle inner border gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop shadow for Chef Hat -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#064e3b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with smooth iOS style corner radius -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#foodflow-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#gloss)" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#border-grad)" stroke-width="1.2" fill="none" />

  <!-- Chef Hat (App's exact Lucide ChefHat icon scaled and centered) -->
  <g transform="translate(12, 12) scale(1.6667)" filter="url(#shadow)">
    <!-- Translucent hat fill for rich modern aesthetic and readability -->
    <path 
      d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z" 
      fill="#ffffff" 
      fill-opacity="0.18" 
      stroke="#ffffff" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Lower brim line -->
    <path 
      d="M6 17h12" 
      stroke="#ffffff" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
  </g>

  <!-- AI Sparkle Star (Reflecting FoodFlow AI Engine) -->
  <path 
    d="M48 10 C48 12.8 49.6 14.5 52.4 14.5 C49.6 14.5 48 16.2 48 19 C48 16.2 46.4 14.5 43.6 14.5 C46.4 14.5 48 12.8 48 10 Z" 
    fill="#ffffff" 
    opacity="0.95"
    filter="url(#shadow)"
  />
</svg>